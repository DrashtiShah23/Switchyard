# Local demonstration stack — zero cost. SQLite only; no Postgres/AWS.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SWITCHYARD_ENV: local
      SWITCHYARD_LOG_LEVEL: INFO
      SWITCHYARD_API_KEYS: replace-me:local-developer
      SWITCHYARD_DATABASE_URL: sqlite:///./data/switchyard.db
      SWITCHYARD_TERRAFORM_MODE: mock
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
